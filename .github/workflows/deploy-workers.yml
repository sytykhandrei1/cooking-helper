name: Deploy to Cloudflare Workers

# Публикует production-сборку Expo/React Native Web на Cloudflare Workers.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Параллельные деплои перетирали бы друг друга: держим одну очередь
# и отменяем неактуальную сборку, если следом прилетел новый пуш.
concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://cooking-helper.asytykh.workers.dev/
    env:
      PRODUCTION_URL: https://cooking-helper.asytykh.workers.dev/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - run: npm ci

      - name: Check dish database
        run: npm run quality

      # Красный тест останавливает публикацию: на домен уезжает
      # только то, что прошло проверки.
      - name: Test
        run: npm test

      # Пустой EXPO_WEB_BASE_URL — приложение живёт в корне домена воркера.
      - name: Build web bundle
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        run: curl --fail --silent --show-error --location --output /dev/null --retry 6 --retry-delay 5 --retry-all-errors "$PRODUCTION_URL"

      - name: Add production link to summary
        run: |
          echo "Production: [$PRODUCTION_URL]($PRODUCTION_URL)" >> "$GITHUB_STEP_SUMMARY"
